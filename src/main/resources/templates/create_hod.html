<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create HOD</title>
</head>
<body>
    <h2>Create Head of Department</h2>

    <p th:if="${message}" style="color:green;" th:text="${message}"></p>
    <p th:if="${error}" style="color:red;" th:text="${error}"></p>

    <form th:action="@{/hod/create}" method="post" th:object="${hod}">
        <div>
            <label for="name">HOD Name:</label>
            <input type="text" id="name" th:field="*{name}" required/>
        </div>
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" th:field="*{username}" required/>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" required/>
        </div>
        <div>
            <label for="department">Department:</label>
            <select id="department" th:field="*{department}" required>
                <option value="">-- Select Department --</option>
                <option th:each="dept : ${T(com.hostel.smart_hostel.entity.Department).values()}"
                        th:value="${dept}" th:text="${dept}"></option>
            </select>
        </div>
        <br/>
        <button type="submit">Create HOD</button>
    </form>
    <br/>
    <a th:href="@{/hod/login}">Back to Login</a>
</body>
</html>
